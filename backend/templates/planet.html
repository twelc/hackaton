<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Планета</title>

<script src="https://d3js.org/d3.v3.min.js"></script>
<script src="https://d3js.org/d3.geo.projection.v0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-celestial@0.7.35/celestial.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/d3-celestial@0.7.35/celestial.min.css" rel="stylesheet">
</head>
<body style="margin:0;background:#0a0a0a;color:#ddd;font:14px system-ui,sans-serif;padding:24px 16px">

<a id="backLink" href="index.html"
   style="color:#888;text-decoration:none;font-size:13px">← назад</a>

<div id="content" style="max-width:900px;margin:24px auto 0"></div>

<h2 style="max-width:900px;margin:32px auto 12px;font-weight:500;font-size:14px;color:#9bc;padding-bottom:6px;border-bottom:1px solid #1a1a1a;text-transform:uppercase;letter-spacing:0.06em">
  Карта звёздного неба
</h2>

<div style="max-width:900px;margin:0 auto 12px;font-size:13px;color:#888">
  <label style="margin-right:16px;cursor:pointer">
    <input type="radio" name="skyMode" value="custom" checked> Самописное небо
  </label>
  <label style="cursor:pointer">
    <input type="radio" name="skyMode" value="celestial"> Библиотека (d3-celestial)
  </label>
</div>

<div id="sky-custom" style="max-width:900px;margin:0 auto 24px">
  <canvas id="skyMap" width="900" height="450"
          style="display:block;width:100%;height:auto;background:#05070f;border-radius:4px"></canvas>
</div>

<div id="sky-celestial" style="display:none;max-width:900px;margin:0 auto 24px">
  <div id="celestial-map-wrapper"
       style="position:relative;width:100%;height:450px;border-radius:4px;
              overflow:hidden;background:#05070f">
    <div id="celestial-map" style="width:100%;height:100%"></div>
    <canvas id="marker-canvas"
            style="position:absolute;top:0;left:0;width:100%;height:100%;
                   pointer-events:none;z-index:50"></canvas>
  </div>
</div>


<script
  src="https://code.jquery.com/jquery-4.0.0.min.js"
  integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
  crossorigin="anonymous"></script>


<script src="/static/planet.js"></script>
</body>
</html>
