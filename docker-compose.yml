services:
  angie:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./angie/angie.conf.template:/etc/angie.conf.template:ro
      - ./angie/acme:/var/lib/angie/acme/
    depends_on:
      - web
    networks:
      - app-network
    build:
      context: ./angie
      dockerfile: Dockerfile
      # задаем переменные среды
      args:
        DOMAIN_URL: ${DOMAIN_URL}
    env_file:
      - .env
    logging:
      options:
        max-size: "5m"
        max-file: "5"

  postgres:
    container_name: postgres
    image: postgres:latest
    environment:
      POSTGRES_DB: "hackaton"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
    
    #ports:
    #  - "5432:5432"
    restart: always
    networks:
      - app-network
    
  web:
    restart: always
    build: ./backend
    container_name: web
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge